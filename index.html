<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Photo fills the entire screen -->
  <div class="bg"></div>
  <!-- Gradient darkens only the bottom so the dog stays visible -->
  <div class="overlay"></div>

  <div class="ui">

    <div class="header">
      <h1>Tic-Tac-Toe</h1>
      <p class="subtitle">In honor of a very good girl</p>
    </div>

    <div class="scoreboard">
      <div class="score">
        <span class="player-label x">X</span>
        <span class="score-value" id="wins-x">0</span>
      </div>
      <div class="score">
        <span class="player-label">Draws</span>
        <span class="score-value" id="draws">0</span>
      </div>
      <div class="score">
        <span class="player-label o">O</span>
        <span class="score-value" id="wins-o">0</span>
      </div>
    </div>

    <div class="status" id="status">Player X's turn</div>

    <div class="board" id="board">
      <button class="cell" data-index="0"></button>
      <button class="cell" data-index="1"></button>
      <button class="cell" data-index="2"></button>
      <button class="cell" data-index="3"></button>
      <button class="cell" data-index="4"></button>
      <button class="cell" data-index="5"></button>
      <button class="cell" data-index="6"></button>
      <button class="cell" data-index="7"></button>
      <button class="cell" data-index="8"></button>
    </div>

    <div class="controls">
      <button class="btn" id="restart">Restart</button>
      <button class="btn secondary" id="reset-scores">Reset Scores</button>
    </div>

  </div>

  <script src="game.js"></script>
</body>
</html>
