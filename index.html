<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A sliding photo puzzle — a tribute to a very good girl." />
  <title>Sliding Puzzle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="header">
    <h1>Slide Puzzle</h1>
    <p class="subtitle">In honor of a very good girl</p>
  </div>

  <div class="info-bar">
    <div class="stat">
      <span class="stat-label">Moves</span>
      <span class="stat-value" id="moves">0</span>
    </div>
    <div class="size-toggle">
      <button class="size-btn active" data-size="3">3 × 3</button>
      <button class="size-btn" data-size="4">4 × 4</button>
    </div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="win-overlay" id="win-overlay">
      <p class="win-emoji">🐾</p>
      <p class="win-text">Puzzle solved!</p>
      <p class="win-moves" id="win-moves"></p>
      <button class="btn" id="win-new">Play again</button>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="new-game">New Game</button>
    <button class="btn secondary" id="show-preview">Preview</button>
  </div>

  <!-- Preview modal: toggled with .open class (more reliable than hidden on iOS) -->
  <div class="preview-modal" id="preview-modal">
    <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
    <img src="images/IMG_3440.jpeg" alt="Goal image" />
    <p class="modal-hint">Tap anywhere to close</p>
  </div>

  <script src="game.js"></script>
</body>
</html>
