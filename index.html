<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A mobile-friendly sliding photo puzzle built with vanilla HTML, CSS, and JavaScript. Rearrange the scrambled tiles to reconstruct your favorite photo." />
  <meta name="author" content="rodrigobtu" />
  <meta name="keywords" content="sliding puzzle, photo puzzle, 15-puzzle, 8-puzzle, javascript game, mobile game, pomeranian" />

  <!-- Open Graph (WhatsApp, Facebook, iMessage link previews) -->
  <meta property="og:title" content="Sliding Photo Puzzle" />
  <meta property="og:description" content="Can you reconstruct the photo? A tribute to a very good girl." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="images/IMG_3440.jpeg" />

  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Sliding Photo Puzzle" />
  <meta name="twitter:description" content="Can you reconstruct the photo? A tribute to a very good girl." />
  <meta name="twitter:image" content="images/IMG_3440.jpeg" />

  <title>Sliding Photo Puzzle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="header">
    <h1>Slide Puzzle</h1>
    <p class="subtitle">In honor of a very good girl</p>
  </div>

  <div class="info-bar">
    <div class="stat">
      <span class="stat-label">Moves</span>
      <span class="stat-value" id="moves">0</span>
    </div>
    <div class="size-toggle">
      <button class="size-btn active" data-size="3">3 × 3</button>
      <button class="size-btn" data-size="4">4 × 4</button>
    </div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="win-overlay" id="win-overlay">
      <p class="win-emoji">🐾</p>
      <p class="win-text">Puzzle solved!</p>
      <p class="win-moves" id="win-moves"></p>
      <button class="btn" id="win-new">Play again</button>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="new-game">New Game</button>
    <button class="btn secondary" id="show-preview">Preview</button>
  </div>

  <!-- Native <dialog> — most reliable way to handle modals on iOS Safari -->
  <dialog id="preview-modal">
    <img src="images/IMG_3440.jpeg" alt="Goal image" />
    <button class="modal-close" id="modal-close">✕ Close</button>
  </dialog>

  <script src="game.js"></script>
</body>
</html>
